name: Artifact checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/verify_manifest.py
      - run: python tools/check_sources.py
      - run: python tools/check_context.py
      - run: python tools/check_finite.py
      - run: python implementation/run_experiments.py
      - run: python implementation/supplement/run_local.py
